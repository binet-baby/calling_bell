<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarada Ne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <h1>Aarada Ne</h1>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings ⚙️</a>
        </div>
        <p>Welcome to the Aarada Ne project!</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flashes">
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <div class="camera-section" style="margin-top: 1rem; position: relative; width: 640px; height: 480px; margin-left: auto; margin-right: auto; max-width: 100%;">
            <h2>Live Camera Feed</h2>
            <div style="position: relative; border: 4px solid #333; border-radius: 8px; overflow: hidden; background: #000; width: 100%; height: 100%;">
                <video id="webcam" autoplay playsinline muted style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;"></video>
                <canvas id="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></canvas>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
