<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarada Ne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <h1>Aarada Ne</h1>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings ⚙️</a>
        </div>
        <p>Welcome to the Aarada Ne project!</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flashes">
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <!-- Camera Feed Section -->
        <div class="camera-section" style="margin-top: 1rem;">
            <h2>Live Camera Feed</h2>
            <div style="border: 4px solid #333; border-radius: 8px; display: inline-block; overflow: hidden; background: #000;">
                <img src="{{ url_for('video_feed') }}" alt="Webcam Feed" style="max-width: 100%; display: block;" onerror="this.onerror=null; this.alt='Camera Unavailable';">
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
